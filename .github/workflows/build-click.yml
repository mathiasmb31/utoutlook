name: Build Click Package

# Runs on:
# - Manual trigger (workflow_dispatch) — pick a branch
# - Tag push (v*) — automatic release build
# - Push to main with [click] in the commit message

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'feature/improvements'
        type: string
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'utoulookmail/**'
      - '.github/workflows/build-click.yml'

jobs:
  build-click:
    name: Build Click (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      # --------------------------------------------------------
      # 1. Build Electron tar.gz (arm64 + x64)
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: utoulookmail/utoutlookmail/package-lock.json

      - name: Install Electron dependencies
        working-directory: utoulookmail/utoutlookmail
        run: npm ci

      - name: Build Electron tar.gz
        working-directory: utoulookmail/utoutlookmail
        run: npm run dist:linux:targz

      # --------------------------------------------------------
      # 2. Install clickable
      # --------------------------------------------------------
      - name: Install clickable
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools
          pip3 install --break-system-packages clickable
          clickable --version

      # --------------------------------------------------------
      # 3. Build the click package
      # --------------------------------------------------------
      - name: Build click package
        working-directory: utoulookmail
        run: clickable build --arch arm64

      # --------------------------------------------------------
      # 4. Upload artifacts
      # --------------------------------------------------------
      - name: Upload click package
        uses: actions/upload-artifact@v4
        with:
          name: utoutlook-click
          path: utoulookmail/build/**/*.click
          retention-days: 30
          if-no-files-found: error

      - name: Upload Electron tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: electron-targz
          path: utoulookmail/utoutlookmail/dist/*.tar.gz
          retention-days: 30
          if-no-files-found: warn

  # ================================================================
  # Create GitHub Release (only on tag push)
  # ================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-click
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download click package
        uses: actions/download-artifact@v4
        with:
          name: utoutlook-click
          path: ./release

      - name: Download Electron tar.gz
        uses: actions/download-artifact@v4
        with:
          name: electron-targz
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release/*.click
            ./release/*.tar.gz
          generate_release_notes: true
