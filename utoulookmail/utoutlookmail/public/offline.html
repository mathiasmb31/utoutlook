<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1a2e;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Ubuntu', 'Cantarell', sans-serif;
    color: #e0e0e0;
    text-align: center;
    padding: 24px;
  }
  .icon {
    font-size: 72px;
    margin-bottom: 24px;
    opacity: 0.6;
  }
  h1 {
    font-size: 24px;
    font-weight: 300;
    margin-bottom: 12px;
  }
  p {
    font-size: 16px;
    opacity: 0.7;
    margin-bottom: 32px;
    line-height: 1.5;
  }
  .retry-btn {
    padding: 12px 32px;
    font-size: 16px;
    background: #0078d4;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    min-height: 44px;
  }
  .retry-btn:active {
    background: #106ebe;
  }
  .status {
    margin-top: 24px;
    font-size: 13px;
    opacity: 0.5;
  }
  .spinner {
    margin-top: 16px;
    width: 24px; height: 24px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #0078d4;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  .spinner.visible { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="icon">&#x1F4F6;</div>
  <h1>Pas de connexion</h1>
  <p>UToutlook Mail n'arrive pas à se connecter.<br>Vérifiez votre connexion Internet.</p>
  <button class="retry-btn" onclick="retry()">Réessayer</button>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Reconnexion automatique...</div>

  <script>
    let checkInterval;

    function retry() {
      document.getElementById('spinner').classList.add('visible');
      document.getElementById('status').textContent = 'Vérification...';
      // Signal the main process to reload
      if (window.electronAPI && window.electronAPI.reload) {
        window.electronAPI.reload();
      } else {
        location.reload();
      }
    }

    // Poll for connectivity every 3 seconds
    checkInterval = setInterval(() => {
      if (navigator.onLine) {
        document.getElementById('spinner').classList.add('visible');
        document.getElementById('status').textContent = 'Connexion retrouvée !';
        clearInterval(checkInterval);
        setTimeout(() => {
          if (window.electronAPI && window.electronAPI.reload) {
            window.electronAPI.reload();
          } else {
            location.reload();
          }
        }, 1000);
      }
    }, 3000);
  </script>
</body>
</html>
