<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    /* v3.3.19: fond sombre style UBUNTU TOUCH (comme le splash velo-touch) */
    background: #0f0f1a;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Ubuntu', 'Cantarell', sans-serif;
    color: #e8e8e8;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  /* v3.3.19: grand logo centré, même règle que velo-touch : 65% de la largeur, max 768px */
  .logo {
    width: min(65vw, 768px); height: min(65vw, 768px);
    margin-bottom: 24px;
  }
  .logo img {
    width: 100%; height: 100%;
  }
  .app-name {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #E95420;
  }
  .app-sub {
    font-size: 15px;
    color: #888899;
    margin-top: 8px;
  }
  .spinner {
    margin-top: 32px;
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #E95420;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="logo"><img src="../assets/logo-anim.svg" alt="UToutlook Mail"></div>
  <div class="app-name" id="app-name">UToutlook Mail</div>
  <div class="app-sub" id="app-sub">Chargement...</div>
  <div class="spinner"></div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const loading = params.get('loading');
      const appName = params.get('appName');
      if (loading) document.getElementById('app-sub').textContent = loading;
      if (appName) document.getElementById('app-name').textContent = appName;
    })();
  </script>
</body>
</html>
