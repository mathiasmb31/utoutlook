<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0078d4;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Ubuntu', 'Cantarell', sans-serif;
    color: #fff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .logo {
    width: 200px; height: 200px;
    margin-bottom: 24px;
  }
  .logo img {
    width: 100%; height: 100%;
  }
  .app-name {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 1px;
  }
  .app-sub {
    font-size: 14px;
    opacity: 0.7;
    margin-top: 8px;
  }
  .spinner {
    margin-top: 32px;
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #1a1a2e; }
  }
</style>
</head>
<body>
  <div class="logo"><img src="../assets/logo-vibe.svg" alt="UToutlook Mail"></div>
  <div class="app-name" id="app-name">UToutlook Mail</div>
  <div class="app-sub" id="app-sub">Chargement...</div>
  <div class="spinner"></div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const loading = params.get('loading');
      const appName = params.get('appName');
      if (loading) document.getElementById('app-sub').textContent = loading;
      if (appName) document.getElementById('app-name').textContent = appName;
    })();
  </script>
</body>
</html>
