<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   version="1.1"
   width="800"
   height="800"
   viewBox="0 0 800 800"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <!-- Circular text path for rotating text -->
    <path id="circle-text-path" d="
      M 400,400
      m -310,0
      a 310,310 0 1,1 620,0
      a 310,310 0 1,1 -620,0
    " fill="none"/>

    <!-- Reusable text on path -->
    <text id="circle-text" font-family="Ubuntu, Cantarell, sans-serif" font-size="28" font-weight="600" letter-spacing="6" fill="#ffffff" opacity="0.85">
      <textPath href="#circle-text-path" startOffset="0%">HUMAN MADE &#x2022; VIBE VERIFIED &#x2022; HUMAN MADE &#x2022; VIBE VERIFIED &#x2022;&#160;</textPath>
    </text>

    <!-- Mascotte head clipped to a circle -->
    <clipPath id="head-clip">
      <circle cx="400" cy="285" r="105"/>
    </clipPath>
  </defs>

  <!-- Background circle — Ubuntu Touch orange -->
  <circle cx="400" cy="400" r="390" fill="#E95420"/>

  <!-- Inner subtle ring -->
  <circle cx="400" cy="400" r="360" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Rotating text group -->
  <g>
    <use href="#circle-text"/>
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 400 400"
      to="360 400 400"
      dur="20s"
      repeatCount="indefinite"
    />
  </g>

  <!-- Center: mail envelope with the UBTouch mascot head popping out -->
  <g>
    <!-- Envelope body (white), slightly lower so the head overlaps its top edge -->
    <rect x="290" y="400" width="220" height="150" rx="12" fill="#ffffff"/>
    <!-- Envelope flap (top triangle) -->
    <path d="M 290,412 L 400,495 L 510,412" fill="none" stroke="#E95420" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Envelope bottom fold lines -->
    <path d="M 290,540 L 375,470" fill="none" stroke="#E95420" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M 510,540 L 425,470" fill="none" stroke="#E95420" stroke-width="6" stroke-linecap="round" opacity="0.55"/>

    <!-- Mascot head popping out of the envelope (circle-clipped image) -->
    <g>
      <circle cx="400" cy="285" r="112" fill="#ffffff"/>
      <image xlink:href="mascotte-512.png" href="mascotte-512.png" x="295" y="180" width="210" height="210" clip-path="url(#head-clip)" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="400" cy="285" r="112" fill="none" stroke="#ffffff" stroke-width="6"/>
    </g>
  </g>
</svg>
