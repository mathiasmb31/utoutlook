<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   version="1.1"
   width="800"
   height="800"
   viewBox="0 0 800 800"
   xmlns="http://www.w3.org/2000/svg">

  <defs>
    <clipPath id="head-clip"><circle cx="400" cy="420" r="148"/></clipPath>
  </defs>

  <!-- Background circle — Ubuntu Touch orange -->
  <circle cx="400" cy="400" r="390" fill="#E95420"/>
  <circle cx="400" cy="400" r="360" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Open envelope flap (behind the head, apex poking above it) -->
  <path d="M 225,465 L 400,240 L 575,465 Z" fill="#ffffff" stroke="#E95420" stroke-width="9" stroke-linejoin="round"/>

  <!-- Mascot head more than halfway out of the open envelope -->
  <g clip-path="url(#head-clip)">
    <circle cx="400" cy="420" r="155" fill="#ffffff"/>
    <!-- pencil-sketch mascot: bold dark-gray strokes -->
    <g stroke="#2d2d2d" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- head outline -->
      <circle cx="400" cy="420" r="118" stroke-width="15" fill="#fafafa"/>
      <!-- eyes -->
      <circle cx="360" cy="403" r="17" fill="#2d2d2d" stroke="none"/>
      <circle cx="440" cy="403" r="17" fill="#2d2d2d" stroke="none"/>
      <circle cx="366" cy="397" r="5.5" fill="#ffffff" stroke="none"/>
      <circle cx="446" cy="397" r="5.5" fill="#ffffff" stroke="none"/>
      <!-- smile -->
      <path d="M 368,447 Q 400,471 432,447" stroke-width="11"/>
      <!-- pencil shading strokes (light gray) -->
      <g stroke="#b0b0b0" stroke-width="6" opacity="0.8">
        <path d="M 312,375 l 22,-10"/>
        <path d="M 318,393 l 20,-8"/>
        <path d="M 488,375 l -22,-10"/>
        <path d="M 482,393 l -20,-8"/>
        <path d="M 340,495 l 24,8"/>
        <path d="M 436,503 l 24,-6"/>
      </g>
    </g>
  </g>
  <circle cx="400" cy="420" r="155" fill="none" stroke="#ffffff" stroke-width="8"/>

  <!-- Envelope body (open — front pocket only, no closed flap) -->
  <g>
    <rect x="255" y="465" width="290" height="185" rx="14" fill="#ffffff"/>
    <path d="M 255,478 L 400,575 L 545,478" fill="none" stroke="#E95420" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 255,640 L 350,555" fill="none" stroke="#E95420" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
    <path d="M 545,640 L 450,555" fill="none" stroke="#E95420" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  </g>

</svg>
