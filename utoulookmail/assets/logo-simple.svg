<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   version="1.1"
   width="800"
   height="800"
   viewBox="0 0 800 800"
   xmlns="http://www.w3.org/2000/svg">

  <!-- Background circle -->
  <circle cx="400" cy="400" r="390" fill="#0078d4"/>

  <!-- Inner subtle ring -->
  <circle cx="400" cy="400" r="360" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Large white "O" — Outlook style, readable at 64px -->
  <text x="400" y="460" font-family="Ubuntu, Cantarell, sans-serif" font-size="300" font-weight="700" fill="#ffffff" text-anchor="middle">O</text>

  <!-- White envelope below the O — mail context -->
  <g transform="translate(400, 590) scale(0.55)">
    <rect x="-110" y="-55" width="220" height="110" rx="10" fill="#ffffff"/>
    <path d="M -110,-45 L 0,15 L 110,-45" fill="none" stroke="#0078d4" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -110,45 L -35,0" fill="none" stroke="#0078d4" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 110,45 L 35,0" fill="none" stroke="#0078d4" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  </g>

</svg>
