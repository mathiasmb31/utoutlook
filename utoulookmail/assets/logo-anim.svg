<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   version="1.1"
   width="800"
   height="800"
   viewBox="0 0 800 800"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <clipPath id="head-clip">
      <circle cx="400" cy="285" r="105"/>
    </clipPath>
  </defs>

  <!-- Background circle — Ubuntu Touch orange -->
  <circle cx="400" cy="400" r="390" fill="#E95420"/>
  <circle cx="400" cy="400" r="360" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Center: mail envelope -->
  <g>
    <rect x="290" y="400" width="220" height="150" rx="12" fill="#ffffff"/>
    <path d="M 290,412 L 400,495 L 510,412" fill="none" stroke="#E95420" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 290,540 L 375,470" fill="none" stroke="#E95420" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M 510,540 L 425,470" fill="none" stroke="#E95420" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Mascot head popping in and out of the envelope (animated) -->
  <g>
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="translate"
      values="0,60; 0,-10; 0,60"
      keyTimes="0; 0.45; 1"
      dur="3s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"
    />
    <circle cx="400" cy="285" r="112" fill="#ffffff"/>
    <image xlink:href="mascotte-512.png" href="mascotte-512.png" x="295" y="180" width="210" height="210" clip-path="url(#head-clip)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="400" cy="285" r="112" fill="none" stroke="#ffffff" stroke-width="6"/>
  </g>
</svg>
