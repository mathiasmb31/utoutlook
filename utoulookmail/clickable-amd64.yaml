clickable_minimum_required: 8.4.0
framework: ubuntu-touch-24.04-1.x
builder: custom
skip_review: false
kill: prospect-mail

# Plafond mémoire (hôte 11,5 Go RAM, crash OOM 2026-11-04) : parallélisme de build limité
env_vars:
  MAKEFLAGS: "-j4"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

build:

- mkdir -p ${BUILD_DIR}/bin
- mkdir -p $INSTALL_DIR/bin
- mkdir -p $INSTALL_DIR/bin/App
- echo '-----decompress-----'
- echo $INSTALL_DIR/bin
- cd $INSTALL_DIR/bin/App
- ls
- cp "$ROOT"/utoutlookmail/dist/prospect-mail-4.0.37.tar.gz $INSTALL_DIR/bin/App/prospect.tar.gz
- cd $INSTALL_DIR/bin/App && tar xvfz prospect.tar.gz --strip-components=1 
- rm -f $INSTALL_DIR/bin/App/prospect.tar.gz
- gcc $ROOT/utils/mkdir.c -o $ROOT/utils/mkdir
- rm -rf ${ROOT}/squashfs-root/
- echo '-----Compile debs and patches'
- ${ROOT}/compiledeps-amd64.sh
- mkdir -p $INSTALL_DIR/utils
- cp ${ROOT}/utils/*.sh $INSTALL_DIR/utils/
- cp ${ROOT}/utils/settings.json $INSTALL_DIR/utils/
- cp ${ROOT}/utils/mkdir $INSTALL_DIR/utils/ 2>/dev/null || true
- cp ${ROOT}/utils/copy $INSTALL_DIR/utils/ 2>/dev/null || true
# amd64: le binaire C (mkdir) est compile aarch64 sur ce host
# (pas de cross-compiler x86_64) — remplacer utils/mkdir par un script shell
- cp $ROOT/amd64-root/utils/mkdir $INSTALL_DIR/utils/mkdir
- chmod +x $INSTALL_DIR/utils/mkdir



- cp $ROOT/*.sh $INSTALL_DIR/bin
- mkdir -p $INSTALL_DIR/lib/x86_64-linux-gnu
- cp $ROOT/amd64-root/lib/x86_64-linux-gnu/libfuse.so.2.9.9 $INSTALL_DIR/lib/x86_64-linux-gnu/
- cp $ROOT/amd64-root/lib/x86_64-linux-gnu/libfuse.so.2 $INSTALL_DIR/lib/x86_64-linux-gnu/
- cp $ROOT/amd64-root/lib/x86_64-linux-gnu/libfuse.so.2 $INSTALL_DIR/lib/x86_64-linux-gnu/libfuse.so
# System binaries must be embedded: Ubuntu Touch AppArmor confinement
# prevents click apps from executing binaries outside their package.
- cp $ROOT/amd64-root/bin/notify-send $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/ls $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/grep $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/pgrep $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/awk $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/pkill $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/nohup $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/rm $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/ps $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/ping $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/nc $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/sleep $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/touch $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/cat $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/tr $INSTALL_DIR/bin
- cp $ROOT/amd64-root/bin/cut $INSTALL_DIR/bin
# Custom notify binary (D-Bus Postal + Launcher badge) — non cross-compilable ici
# (pas de cross-compiler x86_64 sur le host aarch64) : utoutlook_notify()
# dégrade gracieusement sans le binaire (return 1 silencieux).

install_root_data:
- manifest.json
- utoutlook.apparmor
- utoutlook.desktop
- assets
# utils copié sélectivement dans le build (voir étape cp ${ROOT}/utils/*.sh)
- qml
- push-apparmor.json
- push.json
- content-hub.json
- pushexec
# xdotool removed — no longer used (zoom/text handled natively by Electron)
dependencies_host: ["netcat-traditional", "libnotify-bin", "notify-osd", "psmisc", "g++", "jq", "libgtk2.0-dev", "libgtk-3-dev", "libmaliit-glib-dev", "build-essential", "meson", "libtool", "m4", "automake", "squashfs-tools", "qemu-user-static", "tree", "patchelf", "git", "curl", "python3", "python3-pip", "libudev-dev", "dpkg", "moreutils", "libssl-dev", "libsqlite3-dev", "libcrypto++-dev", "libsqlcipher-dev", "npm", "git-lfs", "execstack", "imagemagick", "librsvg2-bin", "debhelper-compat", "xauth", "xvfb"]

dependencies_target: [ "netcat-traditional","iputils-ping","notify-osd","libnotify-bin","psmisc","qemu-user-static","g++", "fuse", "zlib1g","libfuse2","squashfs-tools","libgtk2.0-dev","libgtk-3-dev","libmaliit-glib-dev"]
