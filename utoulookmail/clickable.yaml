clickable_minimum_required: 8.4.0
builder: custom
skip_review: false
kill: prospect-mail

build:

- mkdir -p ${BUILD_DIR}/bin
- mkdir -p $INSTALL_DIR/bin
- mkdir -p $INSTALL_DIR/bin/App
- echo '-----decompress-----'
- echo $INSTALL_DIR/bin
- cd $INSTALL_DIR/bin/App
- ls
- cp "$ROOT"/utoutlookmail/dist/prospect-mail-*-arm64.tar.gz $INSTALL_DIR/bin/App/prospect.tar.gz
- cd $INSTALL_DIR/bin/App && tar xvfz prospect.tar.gz --strip-components=1 
- rm -f $INSTALL_DIR/bin/App/prospect.tar.gz
- gcc $ROOT/utils/mkdir.c -o $ROOT/utils/mkdir
- gcc $ROOT/utils/firstinstall.c -o $ROOT/utils/firstinstall
- rm -rf ${ROOT}/squashfs-root/
- echo '-----Compile debs and patches'
- ${ROOT}/compiledeps.sh



- cp $ROOT/*.sh $INSTALL_DIR/bin
- mkdir -p $INSTALL_DIR/lib/aarch64-linux-gnu 
- cp /usr/lib/aarch64-linux-gnu/libfuse.so.2.9.9 $INSTALL_DIR/lib/aarch64-linux-gnu/
- cp /usr/lib/aarch64-linux-gnu/libfuse.so.2 $INSTALL_DIR/lib/aarch64-linux-gnu/
- cp /usr/lib/aarch64-linux-gnu/libfuse.so.2 $INSTALL_DIR/lib/aarch64-linux-gnu/libfuse.so
# System binaries must be embedded: Ubuntu Touch AppArmor confinement
# prevents click apps from executing binaries outside their package.
- cp /usr/bin/notify-send $INSTALL_DIR/bin
- cp /usr/bin/ls $INSTALL_DIR/bin
- cp /usr/bin/grep $INSTALL_DIR/bin
- cp /usr/bin/pgrep $INSTALL_DIR/bin
- cp /usr/bin/awk $INSTALL_DIR/bin
- cp /usr/bin/pkill $INSTALL_DIR/bin
- cp /usr/bin/pgrep $INSTALL_DIR/bin
- cp /usr/bin/nohup $INSTALL_DIR/bin
- cp /usr/bin/rm $INSTALL_DIR/bin
- cp /usr/bin/ps $INSTALL_DIR/bin
- cp /usr/bin/ping $INSTALL_DIR/bin
- cp /usr/bin/nc $INSTALL_DIR/bin
- cp /usr/bin/sleep $INSTALL_DIR/bin
- cp /usr/bin/touch $INSTALL_DIR/bin
- cp /usr/bin/cat $INSTALL_DIR/bin
- cp /usr/bin/tr $INSTALL_DIR/bin
- cp /usr/bin/cut $INSTALL_DIR/bin
# Custom notify binary (D-Bus Postal + Launcher badge)
- cp $ROOT/notify /$INSTALL_DIR/bin

install_root_data:
- manifest.json
- utoutlook.apparmor
- utoutlook.desktop
- assets
- utils
- qml
- push-apparmor.json
- push.json
- content-hub.json
- pushexec
# xdotool removed — no longer used (zoom/text handled natively by Electron)
dependencies_host: ["netcat-traditional","libnotify-bin","notify-osd","psmisc","g++","jq","libgtk2.0-dev","libgtk-3-dev","libmaliit-glib-dev","build-essential","meson","libtool","m4","automake","squashfs-tools","qemu-user-static" , "tree" , "patchelf", "git", "jq", "curl", "build-essential", "python3", "python3-pip", "libudev-dev", "dpkg", "moreutils","libssl-dev", "libsqlite3-dev", "libcrypto++-dev", "libsqlcipher-dev", "npm", "git-lfs", "execstack", "imagemagick", "librsvg2-bin", "debhelper-compat", "xauth", "xvfb",'squashfs-tools']

dependencies_target: [ "netcat-traditional","iputils-ping","notify-osd","libnotify-bin","psmisc","qemu-user-static","g++", "fuse", "zlib1g","libfuse2","squashfs-tools","libgtk2.0-dev","libgtk-3-dev","libmaliit-glib-dev"]

env_vars:
  CCACHE_DIR: /mnt/five/vibeworkspace/utoutlook/utoulookmail/.ccache
